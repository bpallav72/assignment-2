<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
        }

        .main {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 90vw;
            height: 27.5vh;
            background: #979da0;
            border-radius: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 8%;
        }

        .btn {
            background: linear-gradient(#00b7ff, #0094d0);
            padding: 1rem 1.9rem;
            font-size: 1.3rem;
            border-radius: 30px;
            color: white;
            border: none;
            margin: auto 1rem 1.5rem 1.5rem;
            box-shadow: inset 0 0 5px #ffffff59;
            font-family: Arial, Helvetica, sans-serif;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="box">
            <button class="btn" id="btn1">Buy Now</button>
            <button class="btn" id="btn2">Larger text to know that we did it correctly</button>
        </div>
    </div>
</body>

</html>
